[project]
name = "hp3478a-async"
authors = [
  { name="Patrick Baus", email="patrick.baus@physik.tu-darmstadt.de" },
]
description = "Python3 AsyncIO HP3478A driver"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering",
]
keywords = ["HP3478A", "GPIB", "API"]
dependencies = []
dynamic = ["version"]

[project.urls]
"Homepage" = "https://github.com/PatrickBaus/pyAsyncHP3478A"
"Bug Tracker" = "https://github.com/PatrickBaus/pyAsyncHP3478A/issues"
"Download" = "https://github.com/PatrickBaus/pyAsyncHP3478A/releases"
"Documentation" = "https://patrickbaus.github.io/pyAsyncHP3478A/"

[project.optional-dependencies]
linux-gpib = ["async-gpib", "gpib-ctypes"]

prologix-gpib = ["prologix-gpib-async"]

# Needed to run the scripts in examples/
examples = [
    "aiofiles", "async-gpib", "gpib-ctypes", "prologix-gpib-async",
]
# Needed to run the test suite. pytest-cov measures the coverage, see the [tool.coverage] sections below.
test = [
    "pytest", "pytest-cov",
]
# Linters and type checkers. pylint also checks examples/ and tests/, so it needs their dependencies.
lint = [
    "hp3478a-async[examples,test]",
    "black", "isort", "mypy", "pre-commit", "pylint", "setuptools", "types-aiofiles",
]
# Building and publishing to PyPI
build = [
    "build", "twine",
]
# Building the documentation
doc = [
    "myst-parser", "sphinx",
]
# Everything needed for development
dev = [
    "hp3478a-async[examples,test,lint,build,doc]",
]

[tool.coverage.run]
# Measure only the library, not the tests or the examples
source = ["hp3478a_async"]
# Generated by setuptools-scm
omit = ["hp3478a_async/_version.py"]
branch = true
# Required by python-coverage-comment-action, it matches the paths in .coverage against the files of the repository
relative_files = true

[tool.coverage.report]
show_missing = true

[tool.pylint.main]
py-version = "3.12"
# Generated by setuptools-scm
ignore = ["_version.py"]

[tool.pylint.'MESSAGES CONTROL']
max-line-length = 120

[tool.isort]
line_length = 120
profile = "black"
py_version = 312

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
# Require @typing.override on every overriding method, so that renaming a base method cannot silently break a subclass
enable_error_code = ["explicit-override"]

[tool.pytest.ini_options]
markers = [
    # conftest.py reorders tests moving slow ones to the end of the list
    "slow",
]

[build-system]
requires = [
    "setuptools>=77.0",  # for the SPDX license expression in [project]
    "setuptools-scm>=8.0",  # for version_file
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# The version is taken from the git tag of the release, e.g. 1.5.0. Commits after a tag get a development version
# like 1.5.1.dev3. The version is written to _version.py during the build. That file is not tracked by git.
version_file = "hp3478a_async/_version.py"
# Leave out the "+g<commit hash>" local version part, which PyPI and TestPyPI reject
local_scheme = "no-local-version"
